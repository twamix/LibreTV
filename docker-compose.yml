services:
  libretv:
    build: .
    # 版本管理：镜像 tag 与 package.json 的 version 保持一致
    # - 使用者：不设置 LIBRETV_IMAGE 即拉取 ghcr.io/twamix/libretv:latest（首次部署用 docker compose pull）
    # - 开发者：docker compose up -d --build 会在本地构建并打上同名 tag
    # - 需要固定版本时设置 LIBRETV_IMAGE=ghcr.io/twamix/libretv:2.0.1
    image: ${LIBRETV_IMAGE:-ghcr.io/twamix/libretv:latest}
    container_name: libretv
    restart: unless-stopped
    ports:
      - "8080:8080"
    # 无状态服务：观看历史在浏览器 IndexedDB、设置在 localStorage，无需挂载卷
    environment:
      # 访问密码（默认 11111，按需修改）与成人内容解锁密码（设置 → 点播源 内输入后可启用 18+ 源）
      PASSWORD: "11111"
      ADULT_PASSWORD: "11111"
      # 以下为常用可选配置，按需取消注释：
      # PROXY_SECRET: "your-secret"
      # COOKIE_SECURE: "true"
      # DEFAULT_SOURCES: '[{"name":"示例源","url":"https://example.com/api.php/provide/vod"}]'
      # DEFAULT_LIVE_SOURCES: '[{"name":"示例直播源","url":"https://example.com/list.m3u","epg":"https://example.com/epg.xml.gz"}]'
      # DEFAULT_SUBSCRIPTIONS: '["https://example.com/sources.json"]'
      # LIVE_ALLOW_PRIVATE: "1"
      # REQUEST_TIMEOUT: "8000"
      # MAX_RETRIES: "1"
      # SEARCH_MAX_PAGES: "5"
      # USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122.0.0.0 Safari/537.36"
      # 60S_API_BASE: "https://60s.viki.moe"
      # DEBUG: "false"
